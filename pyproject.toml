[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prepix"
version = "0.1.0"
description = "A lightweight Python library for data preprocessing, quality checks, and ML utilities."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = [
    "data-quality",
    "eda",
    "data-profiling",
    "pandas",
    "data-validation",
    "schema-validation",
    "machine-learning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

authors = [
    { name = "Manish Parihar" }
]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0",
    "twine>=4.0.0"
]

[project.urls]
Homepage = "https://github.com/manishparihar3618/prepix"
Repository = "https://github.com/manishparihar3618/prepix"
Issues = "https://github.com/manishparihar3618/prepix/issues"

[tool.setuptools.packages.find]
where = ["src"]